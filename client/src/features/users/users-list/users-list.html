<div class="flex items-center justify-center min-h-screen w-full py-20">
  <div class="w-full px-6">
    <div class="flex justify-between mb-3">
      <div class="flex gap-2">
        <button class="btn btn-primary" (click)="createComp.openModal()">
          Lägg till användare
        </button>
      </div>
    </div>

    <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
      <table class="table table-zebra">
        <thead>
          <tr>
            <th>Namn</th>
            <th>Email</th>
            <th>Kund</th>
            <th>Roll</th>
          </tr>
        </thead>
        <tbody>
          @if (users.length === 0) {
            <tr>
              <td colspan="4" class="text-center">Inga användare hittades</td>
            </tr>
          } @else {
            @for (user of users; track user.id) {
              <tr
                class="cursor-pointer hover:bg-primary/10 transition-colors duration-150"
                [routerLink]="['/users', user.id]"
              >
                <td>{{ user.firstName }} {{ user.lastName }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.customerName }}</td>
                <td>
                  <span class="badge badge-outline">{{ user.role }}</span>
                </td>
              </tr>
            }
          }
        </tbody>
      </table>
      <app-paginator
        [totalCount]="totalCount"
        [totalPages]="totalPages"
        [(pageNumber)]="pageNumber"
        [(pageSize)]="pageSize"
        (pageChange)="onPageChange($event)"
      />
    </div>
  </div>
</div>

<app-user-create #createComp (userCreated)="onUserCreated()" />
