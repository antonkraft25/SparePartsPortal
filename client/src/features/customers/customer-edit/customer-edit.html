@if (isModalOpen && customer) {
  <div class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Redigera kund</h3>

      <form [formGroup]="form" (ngSubmit)="saveCustomer()">
        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Namn</span></div>
          <input
            type="text"
            class="input input-bordered w-full"
            [class.input-error]="form.get('name')?.touched && form.get('name')?.invalid"
            formControlName="name"
          />
          <app-validation-errors [control]="form.get('name')" label="Namn" />
        </div>

        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Stad</span></div>
          <input
            type="text"
            class="input input-bordered w-full"
            [class.input-error]="form.get('city')?.touched && form.get('city')?.invalid"
            formControlName="city"
          />
          <app-validation-errors [control]="form.get('city')" label="Stad" />
        </div>

        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Postnummer</span></div>
          <input
            type="text"
            class="input input-bordered w-full"
            [class.input-error]="form.get('postalcode')?.touched && form.get('postalcode')?.invalid"
            formControlName="postalcode"
          />
          <app-validation-errors [control]="form.get('postalcode')" label="Postnummer" />
        </div>

        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Gatuadress</span></div>
          <input
            type="text"
            class="input input-bordered w-full"
            [class.input-error]="form.get('streetName')?.touched && form.get('streetName')?.invalid"
            formControlName="streetName"
          />
          <app-validation-errors [control]="form.get('streetName')" label="Gatuadress" />
        </div>

        <div class="modal-action">
          <button type="submit" class="btn btn-primary">Spara</button>
          <button type="button" class="btn" (click)="closeModal()">Stäng</button>
        </div>
      </form>
    </div>
  </div>
}
