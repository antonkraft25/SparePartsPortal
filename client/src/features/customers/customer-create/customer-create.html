@if (isModalOpen) {
  <div class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Skapa kund</h3>

      <div class="flex flex-col gap-3">
        <label class="form-control">
          <div class="label"><span class="label-text">Namn</span></div>
          <input type="text" class="input input-bordered w-full" [(ngModel)]="name" placeholder="Namn..." />
        </label>

        <label class="form-control">
          <div class="label"><span class="label-text">Stad</span></div>
          <input type="text" class="input input-bordered w-full" [(ngModel)]="city" placeholder="Stad..." />
        </label>

        <label class="form-control">
          <div class="label"><span class="label-text">Postnummer</span></div>
          <input type="text" class="input input-bordered w-full" [(ngModel)]="postalcode" placeholder="Postnummer..." />
        </label>

        <label class="form-control">
          <div class="label"><span class="label-text">Gatuadress</span></div>
          <input type="text" class="input input-bordered w-full" [(ngModel)]="streetName" placeholder="Gatuadress..." />
        </label>
      </div>

      <div class="modal-action">
        <button class="btn btn-primary" (click)="saveCustomer()">Skapa</button>
        <button class="btn" (click)="closeModal()">Stäng</button>
      </div>
    </div>
  </div>
}
