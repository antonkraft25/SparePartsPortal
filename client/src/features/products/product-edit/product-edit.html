@if (isModalOpen && product) {
  <div class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Redigera produkt</h3>

      <form [formGroup]="form" (ngSubmit)="saveProduct()">
        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Namn</span></div>
          <input
            type="text"
            class="input input-bordered w-full"
            [class.input-error]="form.get('name')?.touched && form.get('name')?.invalid"
            formControlName="name"
          />
          <app-validation-errors [control]="form.get('name')" label="Namn" />
        </div>

        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Kopplade reservdelar</span></div>
          @if (!product.spareparts || product.spareparts.length === 0) {
            <p class="text-sm text-base-content/50">Inga reservdelar kopplade</p>
          } @else {
            <ul class="flex flex-col gap-2">
              @for (sparepart of product.spareparts; track sparepart.id) {
                <li class="flex items-center justify-between bg-base-200 px-3 py-2 rounded-lg">
                  <span>{{ sparepart.name }}</span>
                  <button
                    type="button"
                    class="btn btn-xs btn-error"
                    (click)="removeSparepart(sparepart.id)"
                  >
                    Ta bort
                  </button>
                </li>
              }
            </ul>
          }
        </div>

        <div class="modal-action">
          <button type="submit" class="btn btn-primary">Spara</button>
          <button type="button" class="btn" (click)="closeModal()">Stäng</button>
        </div>
      </form>
    </div>
  </div>
}
