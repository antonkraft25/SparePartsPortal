@if (isModalOpen) {
  <div class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Skapa produkt</h3>

      <form [formGroup]="form" (ngSubmit)="saveProduct()">
        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Namn</span></div>
          <input
            type="text"
            class="input input-bordered w-full"
            [class.input-error]="form.get('name')?.touched && form.get('name')?.invalid"
            formControlName="name"
            placeholder="Produktnamn..."
          />
          <app-validation-errors [control]="form.get('name')" label="Namn" />
        </div>

        <div class="modal-action">
          <button type="submit" class="btn btn-primary">Skapa</button>
          <button type="button" class="btn" (click)="closeModal()">Stäng</button>
        </div>
      </form>
    </div>
  </div>
}
