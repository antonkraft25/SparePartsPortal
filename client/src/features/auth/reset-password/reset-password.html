<div class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body gap-4">
      <h1 class="text-2xl font-bold text-center">Återställ lösenord</h1>
      <p class="text-center text-base-content/60">Ange din email och ditt nya lösenord</p>

      <form [formGroup]="form" (ngSubmit)="resetPassword()">
        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Email</span></div>
          <input
            type="email"
            class="input input-bordered w-full"
            [class.input-error]="form.get('email')?.touched && form.get('email')?.invalid"
            formControlName="email"
            placeholder="din@email.se"
          />
          <app-validation-errors [control]="form.get('email')" label="Email" />
        </div>

        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Nytt lösenord</span></div>
          <input
            type="password"
            class="input input-bordered w-full"
            [class.input-error]="
              form.get('newPassword')?.touched && form.get('newPassword')?.invalid
            "
            formControlName="newPassword"
            placeholder="••••••••"
          />
          <app-validation-errors [control]="form.get('newPassword')" label="Lösenord" />
        </div>

        <div class="form-control mb-3">
          <div class="label"><span class="label-text">Bekräfta lösenord</span></div>
          <input
            type="password"
            class="input input-bordered w-full"
            [class.input-error]="
              form.get('confirmPassword')?.touched && form.get('confirmPassword')?.invalid
            "
            formControlName="confirmPassword"
            placeholder="••••••••"
          />
          <app-validation-errors
            [control]="form.get('confirmPassword')"
            label="Bekräfta lösenord"
          />
          @if (form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched) {
            <span class="text-error text-xs mt-1">Lösenorden matchar inte</span>
          }
        </div>

        <button type="submit" class="btn btn-primary w-full mt-2">Återställ</button>
      </form>

      <div class="text-center">
        <a routerLink="/login" class="link link-primary text-sm">Tillbaka till inloggning</a>
      </div>
    </div>
  </div>
</div>
